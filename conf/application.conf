include "frontend.conf"

appName="shortforms-self-assessment-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      address-lookup-frontend {
        protocol = http
        host     = localhost
        port     = 9028
      }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "shortforms-self-assessment-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
  highIncomeChildBenefitChargeUrl = "https://www.gov.uk/child-benefit-tax-charge/pay-tax-charge-paye"
  applyNinoUrl = "https://www.gov.uk/apply-national-insurance-number/how-to-apply"
  iv-uplift-entry = "http://localhost:9948/iv-stub/uplift"
  findYourNinoUrl = "https://www.gov.uk/find-national-insurance-number"
}

agent-restricted.enrolments = ["IR-SA-AGENT", "IR-CT-AGENT", "HMCE-VAT-AGNT", "HMRC-MGD-AGNT", "HMRC-AS-AGENT"]
requiredConfidenceLevel = 250

accessibility-statement{
  service-path = "/shortforms-self-assessment-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = false
}

features {
  welsh-translation: true
}
